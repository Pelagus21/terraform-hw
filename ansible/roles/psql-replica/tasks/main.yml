- name: Install PostgreSQL
  apt:
    name: ["postgresql-{{ postgresql_version }}", "postgresql-contrib-{{ postgresql_version }}", "postgresql-client-{{ postgresql_version }}"]
    state: present
    update_cache: yes

- name: Configure postgresql.conf for logical replication
  lineinfile:
    path: "/etc/postgresql/{{ postgresql_version }}/main/postgresql.conf"
    regexp: "^{{ item.param }}"
    line: "{{ item.param }} = {{ item.value }}"
  loop:
    - { param: "wal_level", value: "logical" }
    - { param: "max_replication_slots", value: "5" }
    - { param: "max_wal_senders", value: "5" }
  notify: restart postgresql

- name: Configure postgres user authentication mode in pg_hba.conf
  lineinfile:
    path: "/etc/postgresql/{{ postgresql_version }}/main/pg_hba.conf"
    regexp: "^local(\s+)all(\s+)postgres(\s+)peer(\s*)"
    line: "local   all             postgres                                trust"
    backrefs: yes
  notify: restart postgresql

- name: Create database for replication
  become: yes
  become_user: postgres
  become_method: enable
  postgresql_db:
    name: "{{ replication_db }}"
    owner: postgres

- name: Create subscription to master
  become: yes
  become_user: postgres
  become_method: enable
  postgresql_query:
    db: "{{ replication_db }}"
    query: >
      CREATE SUBSCRIPTION replica_sub 
      CONNECTION 'host={{ hostvars['server1'].ansible_host }} port=5432 dbname={{ replication_db }} user=replicator password={{ replication_password }}'
      PUBLICATION master_pub;
  register: create_subscription