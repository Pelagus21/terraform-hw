- name: Install postgresql
  apt:
    name: [ "postgresql-{{ postgresql_version }}",
            "postgresql-contrib-{{ postgresql_version }}",
            "postgresql-client-{{ postgresql_version }}",
            "python3-psycopg2" ]
    state: present
    update_cache: yes

- name: Configure postgresql.conf for logical replication
  lineinfile:
    path: "/etc/postgresql/{{ postgresql_version }}/main/postgresql.conf"
    regexp: "^{{ item.param }}"
    line: "{{ item.param }} = {{ item.value }}"
  loop:
    - { param: "wal_level", value: "logical" }
    - { param: "max_replication_slots", value: "5" }
    - { param: "max_wal_senders", value: "5" }

- name: Configure replication connection configuration in pg_hba.conf
  lineinfile:
    path: "/etc/postgresql/{{ postgresql_version }}/main/pg_hba.conf"
    line: "host replication replicator 172.31.37.66/32 md5"

- name: Add user mapping to pg_ident.conf
  lineinfile:
    path: "/etc/postgresql/{{ postgresql_version }}/main/pg_ident.conf"
    line: "user1           root                    postgres"

- name: Configure postgres user authentication mode in pg_hba.conf
  lineinfile:
    path: "/etc/postgresql/{{ postgresql_version }}/main/pg_hba.conf"
    regexp: "^local\\s+all\\s+postgres\\s+peer$"
    line: "local   all             postgres                                trust"
    backrefs: yes

- name: Change listen_addresses in postgresql.conf
  lineinfile:
    path: "/etc/postgresql/{{ postgresql_version }}/main/postgresql.conf"
    regexp: "^#listen_addresses = 'localhost'*"
    line: "listen_addresses = '*'"
    backrefs: yes

- name: restart postgresql service
  systemd:
    name: "postgresql@{{ postgresql_version }}-main.service"
    state: restarted
  become: yes

- name: Create replication user
  become: yes
  become_user: postgres
  become_method: enable
  postgresql_user:
    name: replicator
    password: "{{ replication_password }}"
    role_attr_flags: REPLICATION,LOGIN

- name: Create database for replication
  become: yes
  become_user: postgres
  become_method: enable
  postgresql_db:
    name: "{{ replication_db }}"
    owner: replicator
    state: present

- name: Create publication for all tables
  become: yes
  become_user: postgres
  become_method: enable
  postgresql_query:
    db: "{{ replication_db }}"
    query: >
      DO $$
      BEGIN
        IF NOT EXISTS (SELECT 1 FROM pg_publication WHERE pubname = 'master_pub') THEN
          CREATE PUBLICATION master_pub FOR ALL TABLES;
        END IF;
      END $$;
  register: create_publication