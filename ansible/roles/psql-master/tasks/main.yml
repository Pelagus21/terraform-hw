- name: Install postgresql
  apt:
    name: ["postgresql-{{ postgresql_version }}", "postgresql-contrib-{{ postgresql_version }}", "postgresql-client-{{ postgresql_version }}"]
    state: present
    update_cache: yes

- name: Configure postgresql.conf for logical replication
  lineinfile:
    path: "/etc/postgresql/{{ postgresql_version }}/main/postgresql.conf"
    regexp: "^{{ item.param }}"
    line: "{{ item.param }} = {{ item.value }}"
  loop:
    - { param: "wal_level", value: "logical" }
    - { param: "max_replication_slots", value: "5" }
    - { param: "max_wal_senders", value: "5" }
  notify: restart postgresql

- name: Configure replication connection configuration in pg_hba.conf
  lineinfile:
    path: "/etc/postgresql/{{ postgresql_version }}/main/pg_hba.conf"
    line: "host replication replicator {{ hostvars['server2'].ansible_host }}/32 md5"
  notify: restart postgresql

- name: Configure postgres user authentication mode in pg_hba.conf
  lineinfile:
    path: "/etc/postgresql/{{ postgresql_version }}/main/pg_hba.conf"
    regexp: "^local(\s+)all(\s+)postgres(\s+)peer(\s*)"
    line: "local   all             postgres                                trust"
    backrefs: yes
  notify: restart postgresql

- name: Create replication user
  become: yes
  become_user: postgres
  become_method: enable
  postgresql_user:
    name: replicator
    password: "{{ replication_password }}"
    role_attr_flags: REPLICATION,LOGIN

- name: Create database for replication
  become: yes
  become_user: postgres
  become_method: enable
  postgresql_db:
    name: "{{ replication_db }}"
    owner: replicator

- name: Create publication for all tables
  become: yes
  become_user: postgres
  become_method: enable
  postgresql_query:
    db: "{{ replication_db }}"
    query: CREATE PUBLICATION master_pub FOR ALL TABLES;
  register: create_publication